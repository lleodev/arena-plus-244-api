services:
  postgres:
    image: postgres:17
    container_name: arena-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: lleodev
      POSTGRES_PASSWORD: lleodev924
      POSTGRES_DB: arena

    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: